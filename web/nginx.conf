# Gzip compression — reduces JS/CSS/JSON transfer size by ~60-70%
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1000;
gzip_types text/plain text/css text/javascript application/javascript application/json
           application/xml image/svg+xml;

server {
    listen 80;

    # Security headers
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header X-Frame-Options           "DENY"              always;
    add_header X-XSS-Protection          "1; mode=block"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' https://*.onrender.com https://*.railway.app https://nominatim.openstreetmap.org https://*.tile.openstreetmap.org; frame-src https://www.openstreetmap.org; worker-src blob:;" always;

    # Serve the React SPA
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        autoindex off;
    }

    # Cache hashed static assets forever — filenames change on rebuild so this is safe
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Proxy API requests to the backend — only active in local Docker Compose.
    # BACKEND_HOST is substituted at container start by entrypoint.sh.
    # On Railway/PaaS, VITE_API_URL points directly to the backend so this block is unused,
    # but it must still be syntactically valid — BACKEND_HOST defaults to "localhost" to avoid
    # "host not found in upstream" errors when the backend service is not co-located.
    location /api {
        proxy_pass http://BACKEND_HOST:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";
        proxy_read_timeout 86400;
        # Required for SSE — disable buffering so events reach the client immediately
        proxy_buffering    off;
        proxy_cache        off;
    }

    # Proxy uploaded images to the backend (local Docker Compose only)
    location /uploads {
        proxy_pass http://BACKEND_HOST:8000;
        proxy_set_header Host $host;
        autoindex off;
    }
}
